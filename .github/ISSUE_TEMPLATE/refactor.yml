name: "♻️ Refactor"
description: "기능 변경 없이 코드 구조와 가독성을 개선합니다."
title: "[Refactor] "
labels: ["♻️ Refactor"]

body:
  - type: textarea
    id: target
    attributes:
      label: ♻️ 리팩토링 대상
      description: 개선하려는 코드, 파일 또는 모듈을 작성해 주세요.
      placeholder: 어떤 부분을 리팩토링하려는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 💡 리팩토링 이유
      description: 해당 부분을 개선하려는 이유를 작성해 주세요.
      placeholder: 코드 중복, 책임 분리, 가독성 저하 등 개선이 필요한 이유를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 작업할 내용
      description: 리팩토링 작업을 체크리스트 형태로 작성해 주세요.
      placeholder: |
        - [ ] 중복 코드 제거
        - [ ] 함수 또는 클래스 분리
        - [ ] 변수 및 함수명 정리
        - [ ] 코드 주석 작성
        - [ ] 코드 가독성 개선
        - [ ] 기존 동작 확인
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: 🎯 완료 조건
      description: 공통 완료 조건을 확인하고, 리팩토링별 완료 조건을 추가해 주세요.
      value: |
        - [ ] 기존 기능의 동작이 변경되지 않는다.
        - [ ] 코드의 가독성과 구조가 개선되었다.
        - [ ] 중복되거나 불필요한 코드가 제거되었다.
        - [ ] 직접 실행하여 기존 기능이 정상적으로 동작하는지 확인했다.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 🙋 참고 자료
      description: 관련 이슈, 문서 또는 참고할 자료가 있다면 작성해 주세요.
      placeholder: 관련 이슈 번호, 문서, 링크 등을 작성해 주세요.