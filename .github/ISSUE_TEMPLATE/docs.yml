name: "📄 Docs"
description: "문서를 새로 작성하거나 기존 문서를 수정합니다."
title: "[Docs] "
labels: ["📄 Docs"]

body:
  - type: textarea
    id: description
    attributes:
      label: 📄 설명
      description: 작성하거나 수정하려는 문서 작업의 목적을 작성해 주세요.
      placeholder: 어떤 문서를 왜 작성하거나 수정하려는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 📁 대상 문서
      description: 작업 대상이 되는 파일이나 문서를 작성해 주세요.
      placeholder: |
        README.md
        docs/requirements.md
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 작업할 내용
      description: 문서 작업 내용을 체크리스트 형태로 작성해 주세요.
      placeholder: |
        - [ ] 내용 추가
        - [ ] 잘못된 내용 수정
        - [ ] 문서 구조 정리
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: 🎯 완료 조건
      description: 공통 완료 조건을 확인하고, 문서별 완료 조건을 추가해 주세요.
      value: |
        - [ ] 문서의 목적과 내용이 일치한다.
        - [ ] 오탈자 및 잘못된 표현을 확인했다.
        - [ ] '작업할 내용'에 작성한 모든 작업을 완료했다.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 🙋 참고 자료
      description: 참고할 문서, 관련 이슈 또는 링크가 있다면 작성해 주세요.
      placeholder: 관련 문서, 이슈 번호, 링크 등을 작성해 주세요.