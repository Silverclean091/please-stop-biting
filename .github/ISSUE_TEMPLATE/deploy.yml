name: "🌎 Deploy"
description: "빌드, 패키징 및 배포 관련 작업을 진행합니다."
title: "[Deploy] "
labels: ["🌎 Deploy"]

body:
  - type: textarea
    id: description
    attributes:
      label: 🌎 배포 내용
      description: 진행하려는 빌드, 패키징 또는 배포 작업에 대해 작성해 주세요.
      placeholder: 어떤 결과물을 어떤 방식으로 배포하려는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 🎯 배포 대상
      description: 배포 대상 환경이나 결과물을 작성해 주세요.
      placeholder: |
        macOS
        please-stop-biting.app
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 작업할 내용
      description: 배포를 위해 필요한 작업을 체크리스트 형태로 작성해 주세요.
      placeholder: |
        - [ ] 애플리케이션 빌드
        - [ ] 실행 파일 생성
        - [ ] 실행 테스트
        - [ ] 권한 동작 확인
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: 🎯 완료 조건
      description: 공통 완료 조건을 확인하고, 배포별 완료 조건을 추가해 주세요.
      value: |
        - [ ] 대상 macOS 환경에서 정상적으로 실행된다.
        - [ ] 필요한 권한 요청이 정상적으로 동작한다.
        - [ ] 빌드 또는 패키징 과정에서 오류가 발생하지 않는다.
        - [ ] 주요 기능이 배포 환경에서도 정상적으로 동작한다.
        - [ ] 불필요한 개발용 파일 및 디버그 설정이 포함되지 않았다.
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: ⚠️ 확인할 사항
      description: 배포 과정에서 확인해야 할 사항이나 알려진 문제가 있다면 작성해 주세요.
      placeholder: 권한, 호환성, 빌드 환경 등 확인할 내용을 작성해 주세요.

  - type: textarea
    id: reference
    attributes:
      label: 🙋 참고 자료
      description: 배포 관련 문서, 관련 이슈 또는 참고 링크가 있다면 작성해 주세요.
      placeholder: 관련 문서, 이슈 번호, 링크 등을 작성해 주세요.